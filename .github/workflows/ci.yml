name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest ruff
      - name: Ruff
        run: ruff check semaphore tests
      - name: Pytest
        run: pytest tests/ -q
