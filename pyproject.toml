[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semaphore-agent"
version = "0.2.0"
description = "Visual traffic-light overlay for multi-agent AI task status on Wayland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
semaphore = "semaphore.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semaphore*"]

[tool.setuptools.package-data]
semaphore = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
